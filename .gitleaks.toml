# The default rules, except for the made-up API key that the case files plant as a canary. It is listed by exact
# value, not by folder, so a real key in the same files is still caught.
title = "agent-injection-tests"

[extend]
useDefault = true

[allowlist]
description = "The canary API key in config/fund_agent/cases/company.yaml, which is not a credential."
regexes = ['''^sk\-test\-ef\-CANARY\-9X2Q$''']
