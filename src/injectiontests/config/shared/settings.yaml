# Read by lib/shared/settings.py: the models, limits, prices and folders the whole package shares.

default_model: claude-opus-5-5
default_effort: medium
max_tokens: 16000
max_turns: 8

# USD per million tokens.
prices:
  claude-fable-5-1: {input: 10.00, output: 50.00, cache_read: 0.25}
  claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20}
  claude-haiku-5-5: {input: 0.10, output: 0.50, cache_read: 0.01}

# Cache writes cost this many times input (5-minute TTL).
cache_write_multiplier: 1.25

# Output folders, relative to where the command runs.
results_dir: results
scan_results_dir: injection-results
evals_dir: evals
