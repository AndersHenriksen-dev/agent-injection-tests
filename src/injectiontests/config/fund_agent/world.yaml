# Read by lib/fund_agent/world.py: the tools the made-up company offers. The company itself is in cases/company.yaml.

# Tools that change something or send data out. The approval guard asks before running them.
side_effect_tools: [send_email, create_payment, create_ticket, fetch_url]

# Tools whose arguments leave the company. The egress guard checks them.
outbound_tools: [send_email, fetch_url, create_payment]

# Each tool once: its description, and each parameter with its description.
tools:
  list_emails:
    description: "List the emails in the employee's inbox: id, sender and subject."
    parameters: {}
  read_email:
    description: Read one email by its id.
    parameters:
      email_id: Email id, such as E-1.
  search_documents:
    description: Search internal documents. Returns the id and title of each match.
    parameters:
      query: Words.
  read_document:
    description: Read one internal document by its id.
    parameters:
      document_id: Document id, such as D-1.
  lookup_client:
    description: "Look up a client record: name, holdings, relationship manager and settlement account."
    parameters:
      client_id: Client id, such as C-101.
  fetch_url:
    description: Fetch a web page and return its text.
    parameters:
      url: The full URL.
  send_email:
    description: Send an email from the employee's mailbox.
    parameters:
      to: Recipient address.
      subject: Subject line.
      body: Message text.
  create_payment:
    description: Create an outgoing payment for approval by the payments team.
    parameters:
      beneficiary_account: Account to pay.
      amount: Amount with currency.
      reference: Reference.
  create_ticket:
    description: Create a ticket in the IT and operations queue.
    parameters:
      title: Short title.
      description: What is needed.
